apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    cnrm.cloud.google.com/version: 0.0.0-dev
  creationTimestamp: null
  name: containerclusters.container.cnrm.cloud.google.com
spec:
  group: container.cnrm.cloud.google.com
  names:
    categories:
    - gcp
    kind: ContainerCluster
    listKind: ContainerClusterList
    plural: containerclusters
    shortNames:
    - gcpcontainercluster
    - gcpcontainerclusters
    singular: containercluster
  preserveUnknownFields: false
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].message
      name: Status
      type: string
    - jsonPath: .status.observedState.endpoint
      name: Endpoint
      type: string
    - jsonPath: .status.observedState.currentMasterVersion
      name: MasterVersion
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: ContainerCluster is the Schema for the container API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            properties:
              addonsConfig:
                description: Configuration for the addons that can be automatically
                  spun up in the cluster, enabling additional functionality.
                properties:
                  horizontalPodAutoscaling:
                    description: Configuration for the horizontal pod autoscaling
                      feature, which increases or decreases the number of replica
                      pods a replication controller has based on the resource usage
                      of the existing pods.
                    properties:
                      disabled:
                        description: Whether the Horizontal Pod Autoscaling feature
                          is enabled in the cluster. When enabled, it ensures that
                          metrics are collected into Stackdriver Monitoring.
                        type: boolean
                    required:
                    - disabled
                    type: object
                  httpLoadBalancing:
                    description: Configuration for the HTTP (L7) load balancing controller
                      addon, which makes it easy to set up HTTP load balancers for
                      services in a cluster.
                    properties:
                      disabled:
                        description: Whether the HTTP Load Balancing controller is
                          enabled in the cluster. When enabled, it runs a small pod
                          in the cluster that manages the load balancers.
                        type: boolean
                    required:
                    - disabled
                    type: object
                  networkPolicyConfig:
                    description: Configuration for NetworkPolicy. This only tracks
                      whether the addon is enabled or not on the Master, it does not
                      track whether network policy is enabled for the nodes.
                    properties:
                      disabled:
                        description: Whether NetworkPolicy is enabled for this cluster.
                        type: boolean
                    required:
                    - disabled
                    type: object
                type: object
              clusterIpv4Cidr:
                description: The IP address range of the container pods in this cluster,
                  in [CIDR](http://en.wikipedia.org/wiki/Classless_Inter-Domain_Routing)
                  notation (e.g. `10.96.0.0/14`). Leave blank to have one automatically
                  chosen or specify a `/14` block in `10.0.0.0/8`.
                type: string
              description:
                type: string
              initialNodeCount:
                description: |-
                  The number of nodes to create in this cluster. You must ensure that your
                  Compute Engine [resource
                  quota](https://cloud.google.com/compute/docs/resource-quotas) is sufficient
                  for this number of nodes. You must also have available firewall and routes
                  capacity.

                  This field is deprecated and will be removed in a future version of GKE.
                  Use the `initial_node_count` field in the `node_pool` message instead.
                format: int32
                type: integer
              location:
                description: Immutable. Location of the instance.
                type: string
              loggingService:
                description: |-
                  The logging service the cluster should use to write logs.
                  Currently available options:

                  * `logging.googleapis.com/kubernetes` - The Cloud Logging service with a
                    Kubernetes-native resource model
                  * `logging.googleapis.com` - The legacy Cloud Logging service (no longer
                    available as of GKE 1.15).
                  * `none` - no logs will be exported from the cluster.

                  If left as an empty string,`logging.googleapis.com/kubernetes` will be
                  used for GKE 1.14+ or `logging.googleapis.com` for earlier versions.
                type: string
              masterAuth:
                description: 'The authentication information for accessing the master
                  endpoint. If unspecified, the defaults are used: On clusters before
                  v1.12, basic authentication is enabled, a client certificate is
                  issued, and IP-based authentication is disabled. On clusters v1.12
                  and later, basic authentication is disabled, a client certificate
                  is issued, and IP-based authentication is disabled. [IP-based authentication](https://cloud.google.com/kubernetes-engine/docs/how-to/master-authorized-networks)
                  can be enabled by specifying `master_authorized_networks_config`.'
                properties:
                  clientCertificateConfig:
                    description: Configuration for client certificate authentication
                      on the cluster. For clusters before v1.12, if no configuration
                      is specified, a client certificate is issued.
                    properties:
                      issueClientCertificate:
                        description: Issue a client certificate.
                        type: boolean
                    required:
                    - issueClientCertificate
                    type: object
                  password:
                    description: |-
                      The password to use for HTTP basic authentication to the master endpoint.
                      Because the master endpoint is open to the Internet, you should create a
                      strong password.  If a password is provided for cluster creation, username
                      must be non-empty.

                      Warning: basic authentication is deprecated, and will be removed in GKE
                      control plane versions 1.19 and newer. For a list of recommended
                      authentication methods, see:
                      https://cloud.google.com/kubernetes-engine/docs/how-to/api-server-authentication
                    type: string
                  username:
                    description: |-
                      The username to use for HTTP basic authentication to the master endpoint.
                      For clusters v1.6.0 and later, basic authentication can be disabled by
                      leaving username unspecified (or setting it to the empty string).

                      Warning: basic authentication is deprecated, and will be removed in GKE
                      control plane versions 1.19 and newer. For a list of recommended
                      authentication methods, see:
                      https://cloud.google.com/kubernetes-engine/docs/how-to/api-server-authentication
                    type: string
                type: object
              monitoringService:
                description: |-
                  The monitoring service the cluster should use to write metrics.
                  Currently available options:

                  * `monitoring.googleapis.com/kubernetes` - The Cloud Monitoring service with
                    a Kubernetes-native resource model
                  * `monitoring.googleapis.com` - The legacy Cloud Monitoring service (no
                    longer available as of GKE 1.15).
                  * `none` - no metrics will be exported from the cluster.

                  If left as an empty string,`monitoring.googleapis.com/kubernetes` will be
                  used for GKE 1.14+ or `monitoring.googleapis.com` for earlier versions.
                type: string
              network:
                description: The name of the Google Compute Engine [network](https://cloud.google.com/compute/docs/networks-and-firewalls#networks)
                  to which the cluster is connected. If left unspecified, the `default`
                  network will be used.
                type: string
              networkRef:
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: A reference to an externally managed Compute Network
                      resource. Should be in the format `projects/{{projectID}}/global/networks/{{network}}`.
                    type: string
                  name:
                    description: The `name` field of a `ComputeNetwork` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `ComputeNetwork` resource.
                    type: string
                type: object
              nodePools:
                description: The node pools associated with this cluster. This field
                  should not be set if "node_config" or "initial_node_count" are specified.
                items:
                  properties:
                    config:
                      description: The node configuration for the node pool.
                      properties:
                        accelerators:
                          description: A list of hardware accelerators to be attached
                            to each node.
                          items:
                            properties:
                              acceleratorCount:
                                description: The number of the accelerator cards exposed
                                  to an instance.
                                format: int64
                                type: integer
                              acceleratorType:
                                description: The accelerator type resource name.
                                type: string
                            required:
                            - acceleratorCount
                            - acceleratorType
                            type: object
                          type: array
                        diskSizeGb:
                          description: |-
                            Size of the disk attached to each node, specified in GB.
                            The smallest allowed disk size is 10GB.

                            If unspecified, the default disk size is 100GB.
                          format: int32
                          type: integer
                        diskType:
                          description: |-
                            Type of the disk attached to each node (e.g. 'pd-standard', 'pd-ssd' or
                            'pd-balanced')

                            If unspecified, the default disk type is 'pd-standard'
                          type: string
                        imageType:
                          description: The image type to use for this node. Note that
                            for a given image type, the latest version of it will
                            be used. Please see https://cloud.google.com/kubernetes-engine/docs/concepts/node-images
                            for available image types.
                          type: string
                        labels:
                          additionalProperties:
                            type: string
                          description: The map of Kubernetes labels (key/value pairs)
                            to be applied to each node.
                          type: object
                        localSsdCount:
                          description: The number of local SSD disks to be attached
                            to the node.
                          format: int32
                          type: integer
                        machineType:
                          description: |-
                            The name of a Google Compute Engine [machine
                            type](https://cloud.google.com/compute/docs/machine-types)

                            If unspecified, the default machine type is `e2-medium`.
                          type: string
                        metadata:
                          additionalProperties:
                            type: string
                          description: The metadata key/value pairs assigned to instances
                            in the cluster.
                          type: object
                        minCpuPlatform:
                          description: Minimum CPU platform to be used by this instance.
                          type: string
                        oauthScopes:
                          description: |-
                            The set of Google API scopes to be made available on all of the
                            node VMs under the "default" service account.

                            The following scopes are recommended, but not required, and by default are
                            not included:

                            * `https://www.googleapis.com/auth/compute` is required for mounting
                            persistent storage on your nodes.
                            * `https://www.googleapis.com/auth/devstorage.read_only` is required for
                            communicating with **gcr.io**
                            (the [Google Container
                            Registry](https://cloud.google.com/container-registry/)).

                            If unspecified, no scopes are added, unless Cloud Logging or Cloud
                            Monitoring are enabled, in which case their required scopes will be added.
                          items:
                            type: string
                          type: array
                        preemptible:
                          description: Whether the nodes are created as preemptible
                            VM instances.
                          type: boolean
                        serviceAccount:
                          description: The Google Cloud Platform Service Account to
                            be used by the node VMs. Specify the email address of
                            the Service Account; otherwise, if no Service Account
                            is specified, the "default" service account is used.
                          type: string
                        tags:
                          description: The list of instance tags applied to all nodes.
                          items:
                            type: string
                          type: array
                      type: object
                    initialNodeCount:
                      description: The number of nodes in the node pool.
                      format: int32
                      type: integer
                    locations:
                      description: The list of Google Compute Engine [zones](https://cloud.google.com/compute/docs/zones#available)
                        in which the node pool's nodes should be located.
                      items:
                        type: string
                      type: array
                    name:
                      description: The name of the node pool.
                      type: string
                    version:
                      description: The version of the node software components.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              projectRef:
                description: Immutable. The Project that this resource belongs to.
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: The `projectID` field of a project, when not managed
                      by Config Connector.
                    type: string
                  kind:
                    description: The kind of the Project resource; optional but must
                      be `Project` if provided.
                    type: string
                  name:
                    description: The `name` field of a `Project` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `Project` resource.
                    type: string
                type: object
              resourceID:
                description: Immutable. Optional. The name of the resource. Used for
                  creation and acquisition. When unset, the value of `metadata.name`
                  is used as the default.
                type: string
              subnetwork:
                description: The name of the Google Compute Engine [subnetwork](https://cloud.google.com/compute/docs/subnetworks)
                  to which the cluster is connected.
                type: string
              subnetworkRef:
                oneOf:
                - not:
                    required:
                    - external
                  required:
                  - name
                - not:
                    anyOf:
                    - required:
                      - name
                    - required:
                      - namespace
                  required:
                  - external
                properties:
                  external:
                    description: The ComputeSubnetwork selflink of form "projects/{{project}}/regions/{{region}}/subnetworks/{{name}}",
                      when not managed by Config Connector.
                    type: string
                  name:
                    description: The `name` field of a `ComputeSubnetwork` resource.
                    type: string
                  namespace:
                    description: The `namespace` field of a `ComputeSubnetwork` resource.
                    type: string
                type: object
            required:
            - location
            - projectRef
            type: object
          status:
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the object's current state.
                items:
                  properties:
                    lastTransitionTime:
                      description: Last time the condition transitioned from one status
                        to another.
                      type: string
                    message:
                      description: Human-readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: Unique, one-word, CamelCase reason for the condition's
                        last transition.
                      type: string
                    status:
                      description: Status is the status of the condition. Can be True,
                        False, Unknown.
                      type: string
                    type:
                      description: Type is the type of the condition.
                      type: string
                  type: object
                type: array
              externalRef:
                description: A unique specifier for the ContainerCluster resource
                  in GCP.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the resource
                  that was most recently observed by the Config Connector controller.
                  If this is equal to metadata.generation, then that means that the
                  current reported status reflects the most recent desired state of
                  the resource.
                format: int64
                type: integer
              observedState:
                description: ObservedState is the state of the resource as most recently
                  observed in GCP.
                properties:
                  createTime:
                    description: The time the cluster was created, in [RFC3339](https://www.ietf.org/rfc/rfc3339.txt)
                      text format.
                    type: string
                  currentMasterVersion:
                    description: The current software version of the master endpoint.
                    type: string
                  currentNodeVersion:
                    description: The current version of the node software components.
                      If they are currently at multiple versions because of a version
                      update, this field follows the lowest version among all nodes.
                    type: string
                  defaultMaxPodsPerNode:
                    description: The default maximum number of pods per node in this
                      cluster. This doesn't reflect the maximum number of pods per
                      node in managed nodepools.
                    format: int32
                    type: integer
                  endpoint:
                    description: |-
                      The IP address of this cluster's master endpoint.
                      The endpoint can be accessed from the internet at
                      `https://username:password@endpoint/`.

                      See the `masterAuth` property of this resource for username and password
                      information.
                    type: string
                  expireTime:
                    description: The time the cluster will be automatically deleted
                      in [RFC3339](https://www.ietf.org/rfc/rfc3339.txt) text format.
                    type: string
                  nodeIpv4CidrSize:
                    description: The size of the address space on each node for hosting
                      pods.
                    format: int32
                    type: integer
                  servicesIpv4Cidr:
                    description: The IP address range of the Kubernetes services in
                      this cluster, in [CIDR](http://en.wikipedia.org/wiki/Classless_Inter-Domain_Routing)
                      notation (e.g. `1.2.3.4/29`). Service addresses are typically
                      assigned randomly from this range. If left blank, a range will
                      be chosen with the default size.
                    type: string
                  status:
                    description: The current status of this cluster.
                    type: string
                  statusMessage:
                    description: A human-readable description of the status of this
                      cluster.
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
