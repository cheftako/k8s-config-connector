description = "Asks the model to generate the types needed to create the GKE CRD."

prompt = """
Please analyze the following files.
- @.build/third_party/googleapis/google/container/v1/BUILD.bazel
- @.build/third_party/googleapis/google/container/v1/cluster_service.proto
- @.build/third_party/googleapis/google/container/v1/container_gapic.yaml
- @.build/third_party/googleapis/google/container/v1/container_grpc_service_config.json
- @.build/third_party/googleapis/google/container/v1/container_v1.yaml
Please create or update the following files.
- @apis/container/v1beta1/containercluster_identity.go
- @apis/container/v1beta1/containercluster_reference.go
- @apis/container/v1beta1/containercluster_types.go
- @apis/container/v1beta1/docs.go
- @apis/container/v1beta1/generate.sh
- @apis/container/v1beta1/groupversion_info.go

Your response should include:
1. Type objects which can be used to generate the CRD @config/crds/resources/apiextensions.k8s.io_v1_customresourcedefinition_containerclusters.container.cnrm.cloud.google.com.yaml .
2. A brief explanation of the key changes you made and why.
"""
